name: CI - Core Banking Transacoes

on:
  push:
    branches: [ "main" ]
    paths:
      - "core-banking-transacoes/**"

  pull_request:
    branches: [ "main" ]
    paths:
      - "core-banking-transacoes/**"

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: core-banking-transacoes

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Dar permissão ao mvnw
        run: chmod +x mvnw

      - name: Validar estrutura Maven
        run: ./mvnw -version

      - name: Compilar projeto
        run: ./mvnw clean compile

      - name: Rodar testes unitários
        run: ./mvnw test

      - name: Gerar artefato
        run: ./mvnw package -DskipTests

      - name: Verificações do Maven
        run: ./mvnw verify -DskipTests

      - name: Build Quarkus
        run: ./mvnw clean install -DskipTests

      - name: Upload artefato JAR
        uses: actions/upload-artifact@v4
        with:
          name: core-banking-transacoes
          path: core-banking-transacoes/target/*.jar
